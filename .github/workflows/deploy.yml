name: Build and Deploy to K3s via Helm

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'helm/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/receipt-scanner-app:latest
            ghcr.io/${{ env.OWNER_LC }}/receipt-scanner-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Copy Helm chart to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "helm/receipt-scanner"
          target: "~/deploy-tmp"
          strip_components: 0

      - name: Deploy via SSH using Helm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/deploy-tmp

            helm upgrade --install receipt-scanner ./helm/receipt-scanner \
              --namespace receipt-scanner --create-namespace \
              --set image.repository="ghcr.io/${{ env.OWNER_LC }}/receipt-scanner-app" \
              --set image.tag="${{ github.sha }}" \
              --set secrets.botToken="${{ secrets.BOT_TOKEN }}" \
              --set secrets.azureStorageConnectionString="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
              --set secrets.geminiApiKey="${{ secrets.GEMINI_API_KEY }}" \
              --set secrets.postgresUser="${{ secrets.POSTGRES_USER }}" \
              --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
              --set secrets.postgresDb="${{ secrets.POSTGRES_DB }}" \
              --set secrets.tailscaleAuthKey="${{ secrets.TAILSCALE_AUTH_KEY }}"

            rm -rf ~/deploy-tmp