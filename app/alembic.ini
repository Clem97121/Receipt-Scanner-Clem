# Alembic configuration. The database URL is taken from the DATABASE_URL environment variable (see migrations/env.py).
#
# Create a new migration after changing db/models.py (run from the app/ directory):
#   alembic revision --autogenerate -m "short description"
# Migrations are applied automatically when the bot starts (db/migrations.py).

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
