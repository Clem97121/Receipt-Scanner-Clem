#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl
  - git
  - htop
  - ufw

runcmd:
  # Install K3s without built-in Traefik (use your own Ingress if needed)
  - curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644" sh -
  # Configure kubectl permissions for the user
  - mkdir -p /home/devops/.kube
  - cp /etc/rancher/k3s/k3s.yaml /home/devops/.kube/config
  - chown -R devops:devops /home/devops/.kube
  - echo "export KUBECONFIG=/home/devops/.kube/config" >> /home/devops/.bashrc