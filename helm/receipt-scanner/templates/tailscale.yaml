apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "receipt-scanner.name" . }}-tailscale-sa
  labels:
    {{- include "receipt-scanner.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "receipt-scanner.name" . }}-tailscale-role
  labels:
    {{- include "receipt-scanner.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["tailscale"]
  verbs: ["get", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "receipt-scanner.name" . }}-tailscale-rb
  labels:
    {{- include "receipt-scanner.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "receipt-scanner.name" . }}-tailscale-sa
roleRef:
  kind: Role
  name: {{ include "receipt-scanner.name" . }}-tailscale-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "receipt-scanner.name" . }}-tailscale-proxy
  labels:
    {{- include "receipt-scanner.labels" . | nindent 4 }}
    app: tailscale-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-proxy
  template:
    metadata:
      labels:
        app: tailscale-proxy
    spec:
      serviceAccountName: {{ include "receipt-scanner.name" . }}-tailscale-sa
      containers:
      - name: tailscale
        image: tailscale/tailscale:latest
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: {{ include "receipt-scanner.name" . }}-secrets
              key: TAILSCALE_AUTH_KEY
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: TS_ROUTES
          value: "10.42.0.0/16"
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
      volumes:
      - name: tailscale-state
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "receipt-scanner.name" . }}-tailscale-proxy-svc
  labels:
    {{- include "receipt-scanner.labels" . | nindent 4 }}
spec:
  selector:
    app: tailscale-proxy
  ports:
  - port: 3000
    targetPort: 3000
    name: grafana
  - port: 5432
    targetPort: 5432
    name: postgres