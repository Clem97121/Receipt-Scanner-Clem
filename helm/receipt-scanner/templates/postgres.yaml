apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "receipt-scanner.name" . }}-postgres
spec:
  serviceName: {{ include "receipt-scanner.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "receipt-scanner.name" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "receipt-scanner.name" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "receipt-scanner.name" . }}-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "receipt-scanner.name" . }}-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: {{ include "receipt-scanner.name" . }}-postgres